name: secrate-scan

on: 
    workflow_call:

jobs:
    secrate-scan:
        runs-on: ubuntu-latest
        steps:
            - name: code-checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            
            - name: Run Gitleaks
              uses: dortort/betterleaks-action@v0.1.0
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}